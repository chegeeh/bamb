<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coming soon</title>
<meta name="description" content="We're launching soon. Message us on WhatsApp to be first in line.">
<meta name="theme-color" content="#0F2A3D">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0F2A3D;
    --ink-soft: #3D5668;
    --paper: #E9F0EE;
    --sun: #FFB938;
    --wa: #1FAF5A;
    --wa-dark: #178A46;
    --line: rgba(15, 42, 61, .18);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    overflow-x: hidden;
  }
  /* big sun disc: the one memorable shape */
  .sun {
    position: fixed;
    right: -12vmin; top: -12vmin;
    width: 52vmin; height: 52vmin;
    border-radius: 50%;
    background: var(--sun);
    z-index: 0;
  }
  header, main, footer { position: relative; z-index: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding-left: clamp(20px, 5vw, 48px); padding-right: clamp(20px, 5vw, 48px); }
  header { padding-top: 28px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.05rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); animation: pulse 1.8s ease-in-out infinite; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-top: 40px; padding-bottom: 40px; }
  h1 {
    margin: 0 0 22px;
    font-weight: 800;
    font-size: clamp(2.8rem, 11vw, 8rem);
    line-height: .95;
    letter-spacing: -.035em;
    max-width: 11ch;
    animation: rise .8s cubic-bezier(.2,.7,.2,1) both;
  }
  p.lead {
    margin: 0 0 34px;
    max-width: 46ch;
    font-size: clamp(1.05rem, 2.4vw, 1.3rem);
    line-height: 1.5;
    color: var(--ink-soft);
  }
  .cta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 22px; }
  .btn {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--wa); color: #fff;
    text-decoration: none;
    font-weight: 600; font-size: 1.1rem;
    padding: 16px 28px;
    border-radius: 999px;
    box-shadow: 0 6px 0 var(--wa-dark);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(3px); box-shadow: 0 3px 0 var(--wa-dark); }
  .btn:active { transform: translateY(6px); box-shadow: 0 0 0 var(--wa-dark); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .btn svg { width: 24px; height: 24px; fill: currentColor; flex: none; }
  .note { font-size: .95rem; color: var(--ink-soft); max-width: 28ch; line-height: 1.4; }
  footer { padding-top: 18px; padding-bottom: 26px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; font-size: .9rem; color: var(--ink-soft); }
  footer a { color: inherit; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.7); opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { h1, .dot { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>
  <div class="sun" aria-hidden="true"></div>

  <header>
    <span class="dot" aria-hidden="true"></span>
    <span id="brand">Your Brand</span>
  </header>

  <main>
    <h1>Something new is almost here.</h1>
    <p class="lead">We're putting the finishing touches on our launch. Message us on WhatsApp and we'll let you know the moment we go live.</p>
    <div class="cta-row">
      <a class="btn" id="wa" href="https://wa.me/254202101000?text=Hi%2C%20I%27m%20interested.%20Please%20notify%20me%20when%20you%20launch." target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-1.7-.8-2.8-1.5-3.9-3.4-.3-.5.3-.5.8-1.6.1-.2 0-.4 0-.5-.1-.1-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 1.9.8 2.6.9 3.5.7.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 2a10 10 0 0 0-8.6 15L2 22l5.1-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.200l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.200z"/></svg>
        Notify me on WhatsApp
      </a>
      <span class="note">One message is all it takes. No forms, no spam.</span>
    </div>
  </main>

  <footer>
    <span>&copy; <span id="yr"></span> <span id="brand2">Your Brand</span>. All rights reserved.</span>
    <a href="https://wa.me/254202101000" target="_blank" rel="noopener">+254 20 210 1000</a>
  </footer>

<script>
  // Edit this one line to set your brand name everywhere on the page.
  var BRAND = "Your Brand";
  document.getElementById("brand").textContent = BRAND;
  document.getElementById("brand2").textContent = BRAND;
  document.title = BRAND + " | Coming soon";
  document.getElementById("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
